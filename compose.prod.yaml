services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diskcount
      POSTGRES_USER: diskcount
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${DISKCOUNT_PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diskcount"]
      interval: 5s
      timeout: 3s
      retries: 5

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped
    network_mode: host

  diskcount:
    build: .
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      WEB_ADMIN_ADDR: 0.0.0.0:47832
    depends_on:
      db:
        condition: service_healthy
      byparr:
        condition: service_started

volumes:
  pgdata:
