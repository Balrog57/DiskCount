services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diskcount
      POSTGRES_USER: diskcount
      POSTGRES_PASSWORD: diskcount
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diskcount"]
      interval: 5s
      timeout: 5s
      retries: 5

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    restart: unless-stopped

  diskcount:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      byparr:
        condition: service_started
    environment:
      DATABASE_URL: postgres://diskcount:diskcount@db:5432/diskcount
      BYPARR_URL: http://byparr:8191
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_USER_IDS: ${TELEGRAM_ADMIN_USER_IDS:-}
      SCRAPE_INTERVAL_CRON: "@every 4h"
      AMAZON_TLDS: "fr,de"
      LDLC_ENABLED: "true"
      ALTERNATE_TLDS: "fr,de"
      GEIZHALS_ENABLED: "true"
      RDC_ENABLED: "true"
      PCPART_ENABLED: "true"

volumes:
  pgdata:
