[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diskcount"
version = "0.1.0"
description = "Telegram HDD/SSD deal tracker for DiskPrices, Dealabs RSS, and optional Keepa enrichment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DiskCount" }]
dependencies = [
  "aiogram>=3.7,<4",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.2,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
diskcount = "diskcount.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diskcount*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
